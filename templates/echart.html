<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ECharts 折线图</title>
    <!-- 引入 echarts.js -->
    <script src="https://cdn.staticfile.org/echarts/4.3.0/echarts.min.js"></script>
</head>
<body>
    <!-- 为ECharts准备一个具备大小（宽高）的Dom -->
    <div id='echarts_1' style="width: 100%;height:200px;">

    <script type="text/javascript">
        // 基于准备好的dom，初始化echarts实例
    const myChart = echarts.init(document.getElementById('echarts_1'));
    // 指定图表的配置项和数据
    const option = {
            // 标题
            title: {
                text: '折线图'
            },
            // 提示工具
            tooltip: {
                trigger: 'axis'
            },
            // 图例-可筛选查看
            legend: {
                data:['交易量']
            },
            // 调整折线图位置
            grid: {
                left: '3%',
                right: '4%',
                bottom: '3%',
                containLabel: true
            },
            // 工具箱-保存图片
            toolbox: {
                feature: {
                    saveAsImage: {show:true}
                }
            },
            dataZoom:[
                {
                    height: 20,  //时间滚动条的高度
                    type: 'slider', //type的作用是指定数据缩放的类型，slider表示使用滑动条进行缩放，inside表示使用鼠标滚轮进行缩放。
                    xAxisIndex: 0,  // 作用在x轴的下标（因为X轴可以有多个）
                    filterMode: 'filter', // 'filter' 表示滑动时间条直接过滤掉不在时间范围内的数据，'weakFilter'表示滑动时间条时会逐渐过滤掉不在时间范围内的数据
                    start: 0,
                    end: 100
                },
                {
                    height: 20,  //时间滚动条的高度
                    type: 'inside', //type的作用是指定数据缩放的类型，slider表示使用滑动条进行缩放，inside表示使用鼠标滚轮进行缩放。
                    xAxisIndex: 0,  // 作用在x轴的下标（因为X轴可以有多个）
                    filterMode: 'filter', // 'filter' 表示滑动时间条直接过滤掉不在时间范围内的数据，'weakFilter'表示滑动时间条时会逐渐过滤掉不在时间范围内的数据
                    start: 0,
                    end: 100
                }
            ],
            //  x轴
            yAxis: {
                type: 'category',
                boundaryGap: false,
                data: ['00:00','00:01','00:02','00:03','00:04','00:05','00:06','00:07']
            },
            // y轴自动生成
            xAxis: {
                type: 'value'
            },
            series: [
                {
                    name:'交易量',
                    type:'bar',
                    smooth:true,
                    color: '#18A8FF', // 设置颜色
                    data: [12,5,56,23,24,28,18,33]
                }
            ]
        };

    // 使用刚指定的配置项和数据显示图表。
    myChart.setOption(option);
    myChart.getZr().on('click',params=>{
    const pointInPixel= [params.offsetX, params.offsetY];
    if (myChart.containPixel('grid',pointInPixel)) {
        let xIndex= myChart.convertFromPixel({seriesIndex:0},pointInPixel)[1];
        console.log(params)
        console.log(xIndex)
	}
});

    </script>
    </div>
</body>
</html>
